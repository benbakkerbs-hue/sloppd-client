name: Build Sloppd Client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sloppd-Client-Workspace-v4*.zip'
      - '.build-trigger'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Find and extract Sloppd workspace ZIP
        shell: bash
        run: |
          archive="$(find . -maxdepth 1 -type f -name 'Sloppd-Client-Workspace-v4*.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "Workspace ZIP not found."
            exit 1
          fi
          mkdir -p workspace
          unzip -q "$archive" -d workspace
          if [ ! -f workspace/build.gradle ] && [ ! -f workspace/build.gradle.kts ]; then
            echo "Gradle project not found at workspace root."
            exit 1
          fi

      - name: Inspect non-combat compile blockers
        shell: bash
        run: |
          for file in \
            src/main/java/net/anubis/client/gui/BorderlessFullscreen.java \
            src/main/java/com/example/client/mixin/indigo/MixinAbstractTerrainRenderContext.java \
            src/main/java/net/anubis/client/module/impl/render/SkyMesh.java \
            src/main/java/net/anubis/client/module/impl/render/AtmosphereShaderSky.java \
            src/main/java/net/anubis/client/module/impl/render/JumpCirclesModule.java; do
            if [ -f "workspace/$file" ]; then
              echo "===== $file ====="
              sed -n '1,240p' "workspace/$file"
            else
              echo "===== MISSING: $file ====="
            fi
          done

      - name: Apply safe GUI compatibility fix
        shell: bash
        run: |
          file="workspace/src/main/java/net/anubis/client/gui/BorderlessFullscreen.java"
          if [ -f "$file" ]; then
            sed -i 's/(BorderlessFullscreen.Switchable)window/(BorderlessFullscreen.Switchable)(Object)window/' "$file"
          fi

      - name: Build client
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon -p workspace clean build 2>&1 | tee build.log

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sloppd-Client-build
          path: workspace/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sloppd-build-diagnostics
          path: |
            build.log
            workspace/build/reports/
          if-no-files-found: ignore
          retention-days: 14
